<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrossKing — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0d14;--card:#121826;--ln:#212a3b;--ln2:#2b3650;--fg:#eaf0f7;--mut:#8793a6;--accent:#5b8cff;--violet:#a78bfa;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--fg);
       font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;
       background:radial-gradient(900px 500px at 50% -10%, #1a2740 0, #11182655 45%, var(--bg) 75%), var(--bg)}
  .box{width:100%;max-width:380px;background:linear-gradient(180deg,#161d2d,var(--card));border:1px solid var(--ln);
       border-radius:18px;padding:30px 26px;box-shadow:0 30px 80px -30px #000, 0 1px 0 rgba(255,255,255,.04) inset}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;
        background:linear-gradient(135deg,var(--accent),var(--violet));box-shadow:0 8px 22px -8px var(--accent)}
  h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px}
  .sub{color:var(--mut);font-size:12.5px;margin:2px 0 22px;text-transform:uppercase;letter-spacing:1.2px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;letter-spacing:.3px}
  input{width:100%;background:#0d1320;border:1px solid var(--ln);border-radius:11px;color:var(--fg);
        padding:12px 13px;font:inherit;transition:.12s}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.16)}
  button{width:100%;margin-top:22px;padding:12px;border:none;border-radius:11px;font:inherit;font-weight:700;
         cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),#4a6dff);box-shadow:0 10px 24px -10px var(--accent);transition:.12s}
  button:hover{transform:translateY(-1px)} button:disabled{opacity:.6;cursor:default;transform:none}
  .err{display:none;margin-top:16px;padding:10px 12px;border-radius:10px;font-size:13px;
       background:rgba(255,107,107,.12);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,107,107,.4)}
  .err.show{display:block}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:#5b6678;letter-spacing:.3px}
</style></head>
<body>
  <form class="box" id="f" autocomplete="on">
    <div class="brand"><span class="logo">👑</span><div><h1>CrossKing</h1></div></div>
    <div class="sub">War Room · Sign in</div>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Sign in</button>
    <div class="err" id="err">Invalid username or password.</div>
    <div class="foot">authorized access only</div>
  </form>
<script>
  const $=id=>document.getElementById(id);
  $('f').addEventListener('submit', async e=>{
    e.preventDefault();
    $('err').classList.remove('show'); $('btn').disabled=true; $('btn').textContent='Signing in…';
    try{
      const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:$('u').value, password:$('p').value})});
      if(r.ok){ location.href='/'; return; }
      $('err').classList.add('show');
    }catch(_){ $('err').textContent='Connection error. Try again.'; $('err').classList.add('show'); }
    $('btn').disabled=false; $('btn').textContent='Sign in';
  });
</script>
</body></html>
